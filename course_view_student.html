<!-- course_view_student.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>{{ course.code }} - {{ course.name }} - Student View</title>
</head>
<body>
    <header>
        <div class="topnav">
            <div class="logo">
                <img src="{{ url_for('static', filename='P2P.png') }}" alt="Logo"> <!-- Replace with your logo path -->
            </div>

            <div class="user-profile">
                <img src="{{ url_for('static', filename='user.png') }}" alt="Profile picture">
                <span>{{ user.name }}</span>
                <button class="profile-toggle">▼</button> <!-- Clickable element -->
                <div class="profile-links" style="display: none;"> <!-- Initially hidden -->
                    <a href="{{ url_for('logout') }}">Logout</a> <!-- Link to logout -->
                </div>
            </div>
        </div>
    </header>
    
    <div class="main">
        <div class="sidenav">
            <a href="{{ url_for('course_view', course_id=course.id) }}" class="{% if active_page == 'course_view_student' %}active{% endif %}">Main</a>
            <a href="{{ url_for('participants_view', course_id=course.id) }}" class="{% if active_page == 'participants_student' %}active{% endif %}">Participants</a>
            <a href="{{ url_for('evaluation', course_id=course.id) }}" class="{% if active_page == 'evaluation' %}active{% endif %}">Evaluation</a>
            <a href="{{ url_for('view_feedback', course_id=course.id) }}" class="{% if active_page == 'view_feedback' %}active{% endif %}">View Feedback</a>
            <hr>
             <a href="{{ url_for('course_selection') }}">◀ Back to Course List</a>
        </div>

        <div class="webloc-section">
            <p>{{ course.code }} - {{ course.name }} / Main</p>
        </div>

        <!-- Welcome Section -->
        <div class="welcome-section">
            <h2>Welcome, {{ user.name }}</h2>
        </div>

        <div class="dashboard-stats">
            <div class="stats-container"> <!-- New flex container -->
                <div class="stat">
                    <h3>Group</h3>
                    <p style="font-size: 48px; color: #4CAF50;">{{ group_name }}</p> <!-- Display the number of groups -->
                </div>

                <div class="stat">
                    <h3>Assignments</h3>
                    <p style="font-size: 48px; color: #4CAF50;">{{ assignments_count }}</p> <!-- Display the number of assignments -->
                </div>
                <div class="stat">
                    <h3>Evaluations</h3>
                    <p style="font-size: 48px; color: #4CAF50;">{{ evaluations_count }}</p> <!-- Display the number of assignments -->
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const toggleButton = document.querySelector('.profile-toggle');
        const profileLinks = document.querySelector('.profile-links');

        toggleButton.addEventListener('click', function() {
            // Toggle the display of the profile links
            if (profileLinks.style.display === 'none' || profileLinks.style.display === '') {
                profileLinks.style.display = 'block';
            } else {
                profileLinks.style.display = 'none';
            }
        });

        // Optional: Close the profile links if clicking outside
        document.addEventListener('click', function(event) {
            if (!toggleButton.contains(event.target) && !profileLinks.contains(event.target)) {
                profileLinks.style.display = 'none';
            }
        });
    });
</script>
