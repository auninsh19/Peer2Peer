<!-- profile.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>{{ course.code }} - {{ course.name }} - Student View</title>
</head>
<body>
    <header>
        <div class="topnav">
            <div class="logo">
                <img src="{{ url_for('static', filename='P2P.png') }}" alt="Logo">
            </div>

            <div class="user-profile">
                <img src="{{ url_for('static', filename='user.png') }}" alt="Profile picture">
                <span>{{ user.name }}</span>
                <button class="profile-toggle">▼</button>
                <div class="profile-links" style="display: none;">
                    <a href="#">Profile</a>
                    <a href="{{ url_for('logout') }}">Logout</a>
                </div>
            </div>
        </div>
    </header>
    
    <div class="main">
        <div class="sidenav">
            <a href="{{ url_for('course_view', course_id=course.id) }}" class="{% if active_page == 'course_view' %}active{% endif %}">Main</a>
            <a href="{{ url_for('participants_view', course_id=course.id) }}" class="{% if active_page == 'participants' %}active{% endif %}">Participants</a>
            <a href="#">View Feedback</a>
        </div>

        <div class="block">
            <h2>Profile</h2>

            
        </div>
    </div>

    <div class="back-link">
        <a href="{{ url_for('course_selection') }}">Back to Course List</a>
    </div>

    
</body>
</html>
