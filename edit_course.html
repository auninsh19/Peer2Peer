<!-- edit_course.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Course</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- SweetAlert CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>
    <header>
        <div class="topnav">
            <div class="logo">
                <img src="{{ url_for('static', filename='P2P.png') }}" alt="Logo"> <!-- Replace with your logo path -->
            </div>
            
            <div class="user-profile">
                <img src="{{ url_for('static', filename='user.png') }}" alt="Profile picture">
                <span>{{ user.name }}</span>
                <button class="profile-toggle">▼</button> <!-- Clickable element -->
                <div class="profile-links" style="display: none;"> <!-- Initially hidden -->
                    <a href="{{ url_for('logout') }}">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <div class="main">
        <div class="sidenav">
            <a href="{{ url_for('course_management') }}" class="{% if active_page == 'edit_course' %}active{% endif %}">Course Management</a>
        </div>

        <div class="webloc-section">
            <p>Peer2Peer / Edit Course</p>
        </div>

        <div class="block-2">
            <h2>Edit Course</h2>

            <form class="assignment-form" method="POST" action="{{ url_for('edit_course', course_id=course.id) }}">
                <div class="form-group">
                    <label for="code">Course Code:</label>
                    <input type="text" id="code" name="code" value="{{ course.code }}" required>
                </div>

                <div class="form-group">
                    <label for="name">Course Name:</label>
                    <input type="text" id="name" name="name" value="{{ course.name }}" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="web-button">Save Changes</button>
                    <button type="button" class="web-button" onclick="window.location.href='{{ url_for('course_management') }}'">Cancel</button>

                </div>
            </form>
        </div>
    </div>

    <script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function() {
        // Toggle profile dropdown
        const toggleButton = document.querySelector('.profile-toggle');
        const profileLinks = document.querySelector('.profile-links');

        if (toggleButton && profileLinks) {
            toggleButton.addEventListener('click', function() {
                profileLinks.style.display = (profileLinks.style.display === 'none' || profileLinks.style.display === '') 
                    ? 'block' 
                    : 'none';
            });

            // Close profile dropdown if clicked outside
            document.addEventListener('click', function(event) {
                if (!toggleButton.contains(event.target) && !profileLinks.contains(event.target)) {
                    profileLinks.style.display = 'none';
                }
            });
        }
    });
    </script>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="alert-messages">
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
</body>
</html>
